<!--
  CTASection.html — Section CTA finale
  Gardiens des Félins Design System
  Usage : Copier ce bloc comme slide finale de tout carousel ou story
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>CTA Section — Gardiens des Félins</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/carousel.css" />
  <style>
    body { background: #0a0a08; padding: 40px; }
    .carousel-frame { transform: scale(0.4); transform-origin: top left; margin-bottom: -790px; }
  </style>
</head>
<body>

  <!-- Slide CTA finale complète -->
  <div class="carousel-frame slide--cta" style="text-align: center; align-items: center;">

    <div class="slide-header">
      <span class="slide-number">08 / 08</span>
    </div>

    <div class="slide-body" style="align-items: center; gap: 40px;">

      <!-- Logo placeholder (remplacez par votre logo) -->
      <div style="width: 80px; height: 80px; border: 2px solid #B65A2B; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <img
          src="https://i.imgur.com/JPdiSHg.jpeg"
          alt="Logo Gardiens des Félins"
          style="width: 76px; height: 76px; object-fit: cover; border-radius: 50%;"
          onerror="this.style.display='none'"
        />
      </div>

      <!-- Eyebrow -->
      <p class="eyebrow" style="text-align: center;">Association Gardiens des Félins</p>

      <!-- Titre CTA -->
      <h2 class="cta-headline">AGISSEZ MAINTENANT</h2>

      <!-- Actions -->
      <div class="cta-action" style="text-align: center; line-height: 2;">
        Signez la pétition<br />
        Rejoignez-nous<br />
        Partagez ce post
      </div>

      <!-- Séparateur -->
      <div style="width: 60px; height: 2px; background-color: #B65A2B;"></div>

      <!-- URL -->
      <a href="https://linktr.ee/gardiensdesfelins" class="cta-link" style="font-size: 20px; text-align: center;">
        linktr.ee/gardiensdesfelins
      </a>

    </div>

    <!-- Footer -->
    <footer class="slide-footer">
      <span class="org-name">Gardiens des Félins</span>
      <span class="footer-link">Protection animale · France</span>
    </footer>

  </div>

</body>
</html>
